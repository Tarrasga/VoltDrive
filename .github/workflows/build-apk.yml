name: Build VoltDrive Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar APK VoltDrive
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar Dependências Flutter
        run: flutter pub get

      - name: Gerar base Android limpa e aplicar código customizado
        run: |
          rm -rf android
          flutter create . --platforms=android --org=com.voltdrive --project-name=voltdrive
          chmod +x android/gradlew

          # Aplicar configuração Gradle permanente e chave de assinatura estável (Keystore Oficial)
          rm -f android/app/build.gradle.kts
          cp -f native_custom/build.gradle android/app/build.gradle
          cp -f native_custom/voltdrive-release.jks android/app/voltdrive-release.jks

          # Criar as pastas de destino para o pacote com.voltdrive.app
          mkdir -p android/app/src/main/kotlin/com/voltdrive/app
          mkdir -p android/app/src/main/res/xml
          mkdir -p android/app/src/main/res/values

          # Aplicar os ficheiros nativos do VoltDrive (Permissões, Tacógrafo, Overlay, Acessibilidade)
          cp -f native_custom/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp -f native_custom/MainActivity.kt android/app/src/main/kotlin/com/voltdrive/app/MainActivity.kt
          cp -f native_custom/OverlayManager.kt android/app/src/main/kotlin/com/voltdrive/app/OverlayManager.kt
          cp -f native_custom/VoltAccessibilityService.kt android/app/src/main/kotlin/com/voltdrive/app/VoltAccessibilityService.kt
          cp -f native_custom/accessibility_service_config.xml android/app/src/main/res/xml/accessibility_service_config.xml
          cp -f native_custom/file_paths.xml android/app/src/main/res/xml/file_paths.xml
          cp -f native_custom/strings.xml android/app/src/main/res/values/strings.xml
          cp -f native_custom/styles.xml android/app/src/main/res/values/styles.xml

          # Configurar os ícones devidamente redimensionados e otimizados
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          cp -f native_custom/res/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp -f native_custom/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp -f native_custom/res/mipmap-xhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp -f native_custom/res/mipmap-xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp -f native_custom/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Compilar APK Android (Release Ultra-Leve Universal)
        run: |
          # Compilar APK otimizado universal (arm64, arm e x64) com suporte para todos os telemóveis e emuladores
          flutter build apk --release --target-platform android-arm,android-arm64,android-x64 --no-tree-shake-icons 2>&1 | tee build_log.txt
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/VoltDrive.apk
          ls -lh build/app/outputs/flutter-apk/

      - name: Publicar Log de Erro no Git se falhar
        if: failure()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add build_log.txt || true
          git commit -m "build-log: capture compilation error log" || true
          git push origin main || true

      - name: Extrair Versão do pubspec.yaml
        id: extract_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          echo "VERSION=v$VERSION" >> $GITHUB_OUTPUT
          echo "APP_VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Guardar VoltDrive.apk como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoltDrive-Android-APK
          path: build/app/outputs/flutter-apk/VoltDrive.apk

      - name: Publicar Release no GitHub com VoltDrive.apk
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.extract_version.outputs.VERSION }}
          name: "VoltDrive ${{ steps.extract_version.outputs.VERSION }} (Atualizações Rápidas & App Ultra-Leve)"
          files: build/app/outputs/flutter-apk/VoltDrive.apk
          draft: false
          prerelease: false
          body: |
            ## ⚡ VoltDrive ${{ steps.extract_version.outputs.VERSION }}

            ### 🚀 O que há de novo nesta versão:
            1. **🔄 Motor de Atualizações Rápidas & Resiliente**:
               - Resolução do bloqueio de verificações do GitHub com sistema triplo de verificação ultra-rápida.
               - Suporte completo para todos os processadores Android (ARM64, ARMv7 e x86_64).
               - Permissões de instalação do Android otimizadas com ClipData seguro.

            2. **💡 Envio Direto de Sugestões e Reportar Bugs Pela App**:
               - Podes agora enviar sugestões e reportar problemas diretamente dentro da app, com apenas 1 clique, sem precisares de ter o número ou de abrir o WhatsApp.
               - O criador da aplicação recebe o relatório detalhado em tempo real (versão, modelo do carro e descrição).
               - Confirmação imediata de entrega e histórico guardado na tua pasta pessoal.
               - Continua disponível a opção de enviar por WhatsApp caso prefiras.

            3. **⚡ Aplicação Ultra-Leve e Rápida**:
               - Otimização drástica do tamanho da aplicação (redução de mais de 95% no tamanho do ficheiro de instalação!).
               - Arranque mais rápido, menor consumo de memória RAM e poupança significativa de bateria durante os turnos TVDE.
               - Ícones e recursos nativos escalados à medida para todas as resoluções de ecrã.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
