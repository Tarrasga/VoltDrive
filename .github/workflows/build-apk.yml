name: Build Android APK - VoltDrive

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Android APK (Release)
        run: flutter build apk --release

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoltDrive-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish Release with APK
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: VoltDrive v1.0.0 (Build #${{ github.run_number }})
          draft: false
          prerelease: false
          files: build/app/outputs/flutter-apk/app-release.apk
          body: |
            ### ⚡ VoltDrive - Assistente TVDE Elétrico (Renault Zoe Edition)
            
            Ficheiro APK pronto a instalar no teu telemóvel Android.
            
            **Novidades:**
            - ⏱️ Tacógrafo de Horas de Condução TVDE (Lei 45/2018 - Limite 10h e Pausas de 45m).
            - ⚡ Simulador Rápido de Viagem (Uber & Bolt).
            - 🔌 Postos de Carregamento 22 kW AC / 43 kW / 50 kW / 150 kW.
            - 🚗 Perfil Renault Zoe Z.E. 50 (52 kWh, 18.6 kWh/100km).
            - 📊 Fecho do Dia e Balanço Financeiro.
            
            **Como instalar:**
            1. No teu telemóvel Android, descarrega o ficheiro `app-release.apk` abaixo.
            2. Abre o ficheiro e seleciona "Instalar" (permite instalar fontes desconhecidas se pedido).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
