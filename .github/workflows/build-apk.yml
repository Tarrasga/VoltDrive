name: Build VoltDrive Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar APK VoltDrive
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar Dependências Flutter
        run: flutter pub get

      - name: Gerar base Android limpa e aplicar código customizado
        run: |
          rm -rf android
          flutter create . --platforms=android --org=com.voltdrive --project-name=voltdrive
          chmod +x android/gradlew

          # Garantir namespace correto em android/app/build.gradle
          sed -i 's/namespace = ".*"/namespace = "com.voltdrive.app"/g' android/app/build.gradle || true
          sed -i 's/applicationId = ".*"/applicationId = "com.voltdrive.app"/g' android/app/build.gradle || true

          # Criar as pastas de destino para o pacote com.voltdrive.app
          mkdir -p android/app/src/main/kotlin/com/voltdrive/app
          mkdir -p android/app/src/main/res/xml
          mkdir -p android/app/src/main/res/values

          # Aplicar os ficheiros nativos do VoltDrive (Permissões, Tacógrafo, Overlay, Acessibilidade)
          cp -f native_custom/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp -f native_custom/MainActivity.kt android/app/src/main/kotlin/com/voltdrive/app/MainActivity.kt
          cp -f native_custom/OverlayManager.kt android/app/src/main/kotlin/com/voltdrive/app/OverlayManager.kt
          cp -f native_custom/VoltAccessibilityService.kt android/app/src/main/kotlin/com/voltdrive/app/VoltAccessibilityService.kt
          cp -f native_custom/accessibility_service_config.xml android/app/src/main/res/xml/accessibility_service_config.xml
          cp -f native_custom/strings.xml android/app/src/main/res/values/strings.xml

          # Configurar os ícones do Renault Zoe
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          cp assets/icon/app_icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp assets/icon/app_icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp assets/icon/app_icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp assets/icon/app_icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp assets/icon/app_icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Compilar APK Android (Release)
        run: |
          flutter build apk --release --no-tree-shake-icons 2>&1 | tee build_log.txt
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/VoltDrive.apk
          ls -la build/app/outputs/flutter-apk/

      - name: Publicar Log de Erro no Git se falhar
        if: failure()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add build_log.txt || true
          git commit -m "build-log: capture compilation error log" || true
          git push origin main || true

      - name: Guardar VoltDrive.apk como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoltDrive-Android-APK
          path: build/app/outputs/flutter-apk/VoltDrive.apk

      - name: Publicar Release no GitHub com VoltDrive.apk
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.21
          name: VoltDrive v1.0.21 (Leitor Bolt e Janela Flutuante Ativados)
          files: build/app/outputs/flutter-apk/VoltDrive.apk
          draft: false
          prerelease: false
          body: |
            ## ⚡ VoltDrive v1.0.21 - Leitor Bolt/Uber e Janela Flutuante Ativados

            Esta versão ativa o leitor automático de viagens da **Bolt** e **Uber** e a **Janela Flutuante** de cálculo do Renault Zoe!

            ### 📱 Como instalar no teu Samsung:
            1. Toca em **`VoltDrive.apk`** em **Assets** abaixo para descarregar.
            2. Se o Google Play Protect avisar "App bloqueada para proteger o dispositivo":
               - Toca em **"Mais detalhes"** ➔ **"Instalar mesmo assim"**.
               *(Ou desativa temporariamente a verificação na Google Play Store durante a instalação)*.
            3. Na app VoltDrive, no separador **Calculadora**:
               - Toca em **"1. Ativar Janela"** ➔ Procura VoltDrive e liga "Aparecer em cima".
               - Toca em **"2. Ativar Leitor"** ➔ Aplicações Instaladas ➔ Liga "VoltDrive - Leitor TVDE".
               *(Se disser Definição restrita: Definições ➔ Aplicações ➔ VoltDrive ➔ 3 pontinhos ⋮ ➔ Permitir definições restritas)*.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
