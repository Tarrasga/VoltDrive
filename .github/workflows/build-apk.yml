name: Build VoltDrive Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar APK VoltDrive
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar Dependências Flutter
        run: flutter pub get

      - name: Gerar base Android limpa e aplicar código customizado
        run: |
          rm -rf android
          flutter create . --platforms=android --org=com.voltdrive --project-name=voltdrive
          chmod +x android/gradlew

          # Aplicar configuração Gradle permanente e chave de assinatura estável (Keystore Oficial)
          rm -f android/app/build.gradle.kts
          cp -f native_custom/build.gradle android/app/build.gradle
          cp -f native_custom/voltdrive-release.jks android/app/voltdrive-release.jks

          # Criar as pastas de destino para o pacote com.voltdrive.app
          mkdir -p android/app/src/main/kotlin/com/voltdrive/app
          mkdir -p android/app/src/main/res/xml
          mkdir -p android/app/src/main/res/values

          # Aplicar os ficheiros nativos do VoltDrive (Permissões, Tacógrafo, Overlay, Acessibilidade)
          cp -f native_custom/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp -f native_custom/MainActivity.kt android/app/src/main/kotlin/com/voltdrive/app/MainActivity.kt
          cp -f native_custom/OverlayManager.kt android/app/src/main/kotlin/com/voltdrive/app/OverlayManager.kt
          cp -f native_custom/VoltAccessibilityService.kt android/app/src/main/kotlin/com/voltdrive/app/VoltAccessibilityService.kt
          cp -f native_custom/accessibility_service_config.xml android/app/src/main/res/xml/accessibility_service_config.xml
          cp -f native_custom/file_paths.xml android/app/src/main/res/xml/file_paths.xml
          cp -f native_custom/strings.xml android/app/src/main/res/values/strings.xml
          cp -f native_custom/styles.xml android/app/src/main/res/values/styles.xml

          # Configurar os ícones do Renault Zoe
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          cp assets/icon/app_icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp assets/icon/app_icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp assets/icon/app_icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp assets/icon/app_icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp assets/icon/app_icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Compilar APK Android (Release)
        run: |
          flutter build apk --release --no-tree-shake-icons 2>&1 | tee build_log.txt
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/VoltDrive.apk
          ls -la build/app/outputs/flutter-apk/

      - name: Publicar Log de Erro no Git se falhar
        if: failure()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add build_log.txt || true
          git commit -m "build-log: capture compilation error log" || true
          git push origin main || true

      - name: Extrair Versão do pubspec.yaml
        id: extract_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          echo "VERSION=v$VERSION" >> $GITHUB_OUTPUT
          echo "APP_VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Guardar VoltDrive.apk como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoltDrive-Android-APK
          path: build/app/outputs/flutter-apk/VoltDrive.apk

      - name: Publicar Release no GitHub com VoltDrive.apk
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.extract_version.outputs.VERSION }}
          name: "VoltDrive ${{ steps.extract_version.outputs.VERSION }} (Temporizadores TVDE Resilientes, Membros Online/Offline nos Grupos, Verificação de Atualizações no Arranque & Pasta de Sugestões)"
          files: build/app/outputs/flutter-apk/VoltDrive.apk
          draft: false
          prerelease: false
          body: |
            ## ⚡ VoltDrive ${{ steps.extract_version.outputs.VERSION }}

            ### 🚀 O que há de novo e inovador nesta versão:
            1. **⏱️ Temporizadores TVDE Resilientes (Sem Desligar do Nada)**:
               - Cálculo baseado no relógio real do sistema (`syncWithClock` via timestamps precisos).
               - Os contadores de condução e pausa não param nem desligam quando a app fica em segundo plano, com ecrã desligado ou durante a navegação no Uber, Bolt ou Waze.
               - Suporte completo a turnos noturnos que cruzam a meia-noite sem perda de dados nem reinicialização indesejada.
               - Sincronização e gravação instantânea sempre que a app é retomada.
            2. **👥 Membros do Grupo TVDE Sempre Visíveis (Online e Offline)**:
               - Os membros da tua equipa permanecem sempre visíveis no radar e na lista, mesmo quando estão offline.
               - Diferenciação visual clara com cores: `🟢 Online` (em verde elétrico para colegas ativos nos últimos 5 min) vs `⚪ Offline` (em cinzento suave indicando há quanto tempo estiveram ativos).
               - Cache local persistente para não perder a lista de colegas entre reinícios da aplicação.
            3. **🔔 Verificação Automática de Atualizações no Arranque**:
               - Sempre que abres o VoltDrive, a app pesquisa automaticamente por novas versões no GitHub.
               - O alerta de atualização apresenta agora com destaque o que está a inovar nesta versão antes de instalares.
            4. **💡 Pasta de Sugestões & Ideias para a App**:
               - Nova área dedicada acessível nas Definições para enviares as tuas sugestões de melhoria, novas funções TVDE ou reportares erros.
               - Envio direto para o programador via WhatsApp ou armazenamento organizado na tua pasta pessoal.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
