name: Build VoltDrive Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar APK VoltDrive
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar Dependências Flutter
        run: flutter pub get

      - name: Gerar suporte nativo Android e Gradle Wrapper
        run: |
          flutter create . --platforms=android --org=com.voltdrive
          chmod +x android/gradlew
          # Configurar o ícone do Renault Zoe
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          cp assets/icon/app_icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp assets/icon/app_icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp assets/icon/app_icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp assets/icon/app_icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp assets/icon/app_icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Compilar APK Android (Release)
        run: |
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/VoltDrive.apk
          ls -la build/app/outputs/flutter-apk/

      - name: Guardar VoltDrive.apk como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoltDrive-Android-APK
          path: build/app/outputs/flutter-apk/VoltDrive.apk

      - name: Publicar Release no GitHub com VoltDrive.apk
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: VoltDrive v1.0.${{ github.run_number }} (Instalador Android)
          files: build/app/outputs/flutter-apk/VoltDrive.apk
          draft: false
          prerelease: false
          body: |
            ## ⚡ VoltDrive - Assistente TVDE Elétrico (Renault Zoe Edition)
            
            O instalador Android está pronto!
            
            ### 📥 Como instalar no telemóvel:
            1. Toca no ficheiro **`VoltDrive.apk`** em **Assets** abaixo.
            2. Quando terminar o download, clica no ficheiro e escolhe **Instalar**.
            3. Se for pedido, autoriza a instalação de aplicações desta fonte.
            
            O ícone do **Renault Zoe** e o nome **VoltDrive** vão aparecer no teu ecrã inicial!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
